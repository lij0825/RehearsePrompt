name: Official Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (verify builds without publishing release)'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  validate-quality:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Version SSOT & Tag Match Check
        run: node ./scripts/check-version.mjs ${{ github.ref_name }}

      - name: Run Strict TypeScript Check
        run: npm run typecheck

      - name: Run Vitest Suite (28 Tests)
        run: npm test

      - name: Audit Ethical & Security Non-Circumvention
        run: |
          echo "Auditing application source code for prohibited screen stealth / surveillance evasion APIs..."
          PROHIBITED=("SetWindowDisplayAffinity" "WDA_EXCLUDEFROMCAPTURE" "WDA_MONITOR" "desktopCapturer" "anti-cheat" "anticheat" "bypass-guard")
          FOUND=0
          for term in "${PROHIBITED[@]}"; do
            if grep -rn "$term" src/; then
              echo "::error::Prohibited API detected in application code: $term"
              FOUND=1
            fi
          done
          if [ $FOUND -ne 0 ]; then
            echo "Security audit failed."
            exit 1
          fi

  build-windows:
    name: Build Windows Artifacts (x64)
    needs: validate-quality
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Install Dependencies
        run: npm ci

      - name: Compile Application
        run: npm run build

      - name: Build Windows Installers
        run: |
          if (Test-Path "src-tauri/Cargo.toml") {
            cargo tauri build --bundles nsis,msi
          } else {
            powershell -ExecutionPolicy Bypass -File ./scripts/build-windows.ps1
          }

      - name: Sign Binaries (Authenticode)
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: powershell -ExecutionPolicy Bypass -File ./scripts/sign-windows.ps1

      - name: Check Artifact File Sizes (Fail if 0 bytes)
        run: |
          $files = Get-ChildItem -Path "release" -Include "*.exe","*.msi" -Recurse
          if ($files.Count -eq 0) {
            Write-Error "No Windows release files found!"
            exit 1
          }
          foreach ($f in $files) {
            if ($f.Length -le 10MB) {
              Write-Error "File $($f.Name) is smaller than 10MB or 0 bytes!"
              exit 1
            }
          }

      - name: Generate Checksums & Verify Artifacts
        run: |
          node ./scripts/generate-checksums.mjs
          node ./scripts/verify-artifacts.mjs

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            release/*.exe
            release/*.msi
            release/RELEASE_MANIFEST.json
            release/SHA256SUMS.txt
          if-no-files-found: error

  build-macos:
    name: Build macOS Artifacts (arm64 & x64)
    needs: validate-quality
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Dependencies
        run: npm ci

      - name: Compile Application
        run: npm run build

      - name: Setup Apple Developer ID Keychain (Conditional)
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'rehearse-build-keychain' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[ \t]*//' | tr -d '"')

      - name: Build macOS DMGs
        run: |
          chmod +x ./scripts/*.sh
          if [ -f "src-tauri/Cargo.toml" ]; then
            cargo tauri build --bundles dmg
          else
            ./scripts/build-macos.sh
          fi

      - name: Notarize macOS Bundle (Conditional)
        if: env.APPLE_API_KEY != '' || env.APPLE_APP_SPECIFIC_PASSWORD != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize-macos.sh

      - name: Check macOS Artifact Sizes (Fail if 0 bytes)
        run: |
          DMGS=$(find release -maxdepth 1 -name "*.dmg")
          if [ -z "$DMGS" ]; then
            echo "::error::No DMG files generated!"
            exit 1
          fi
          for dmg in $DMGS; do
            size=$(wc -c < "$dmg" | tr -d ' ')
            if [ "$size" -le 10485760 ]; then
              echo "::error::File $dmg size is invalid ($size bytes)!"
              exit 1
            fi
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  publish:
    name: Publish Official GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release-artifacts
          path: dist-release
        continue-on-error: true

      - name: Verify All Artifacts Present & Non-Zero
        run: |
          cd dist-release
          ls -la
          # Verify at least one setup.exe and msi exists
          if [ ! -f RehearsePrompt*setup.exe ] || [ ! -f RehearsePrompt*.msi ]; then
            echo "::error::Required release installers are missing!"
            exit 1
          fi
          # Generate Consolidated SHA-256 Sums
          sha256sum RehearsePrompt* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RehearsePrompt ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist-release/*
          body: |
            ## RehearsePrompt ${{ github.ref_name }}

            모의 면접 및 발표 연습용 데스크톱 텔레프롬프터 공식 릴리스입니다.

            ### 📦 다운로드 안내

            | 운영체제 | 형식 | 아키텍처 | 설명 |
            |---|---|---|---|
            | **Windows** | `.exe` (NSIS) | x64 (Intel/AMD) | 일반 개인 사용자용 기본 설치 프로그램 |
            | **Windows** | `.msi` (WiX) | x64 (Intel/AMD) | 기업/기관 대량 배포용 패키지 |
            | **Windows** | `.exe` (Portable) | x64 (Intel/AMD) | 관리자 권한 없는 무설치 단일 실행 파일 |
            | **macOS** | `.dmg` | arm64 (Apple Silicon) | M1/M2/M3/M4 Mac 전용 |
            | **macOS** | `.dmg` | x64 (Intel) | Intel Mac 전용 |

            ### 🔒 무결성 검증 (SHA-256 Checksums)
            변조 방지를 위해 다운로드한 파일의 SHA-256 해시를 릴리스에 동봉된 `SHA256SUMS.txt`와 비교하십시오.

            ```bash
            # Windows PowerShell
            Get-FileHash -Algorithm SHA256 <파일명>

            # macOS / Linux
            shasum -a 256 <파일명>
            ```

            ### 📚 사용자 가이드 바로가기
            - [5분 빠른 시작 가이드 (QUICK_START_KO.md)](docs/QUICK_START_KO.md)
            - [Windows 설치 가이드 (INSTALL_WINDOWS_KO.md)](docs/INSTALL_WINDOWS_KO.md)
            - [macOS 설치 가이드 (INSTALL_MACOS_KO.md)](docs/INSTALL_MACOS_KO.md)
            - [종합 사용자 설명서 (USER_GUIDE_KO.md)](docs/USER_GUIDE_KO.md)
            - [문제 해결 가이드 (TROUBLESHOOTING_KO.md)](docs/TROUBLESHOOTING_KO.md)
            - [개인정보 및 권한 정책 (PRIVACY_AND_PERMISSIONS_KO.md)](docs/PRIVACY_AND_PERMISSIONS_KO.md)
            - [화면 공유 투명성 고지 (SCREEN_SHARING_NOTICE_KO.md)](docs/SCREEN_SHARING_NOTICE_KO.md)

            ---
            *RehearsePrompt는 화면 공유 숨김 기능이나 시험 감독 우회 API를 일체 포함하지 않는 정직한 연습 도구입니다.*
