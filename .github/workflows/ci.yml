name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality, Types & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Node Dependencies
        run: npm ci

      - name: Verify Version SSOT
        run: node ./scripts/check-version.mjs

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit & Integration Tests (28 Tests)
        run: npm test

      - name: Ethical Non-Circumvention & Privacy Audit
        run: |
          echo "Auditing codebase for prohibited stealth/evasion APIs..."
          PROHIBITED=("SetWindowDisplayAffinity" "WDA_EXCLUDEFROMCAPTURE" "WDA_MONITOR" "desktopCapturer" "anti-cheat" "anticheat" "bypass-guard")
          FOUND=0
          for term in "${PROHIBITED[@]}"; do
            if grep -rn --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=release --exclude-dir=artifacts --exclude="validate-release.mjs" --exclude="verify-all-installers.mjs" "$term" .; then
              echo "::error::Prohibited API detected: $term"
              FOUND=1
            fi
          done
          if [ $FOUND -ne 0 ]; then
            echo "Ethical compliance audit failed."
            exit 1
          fi
          echo "Zero-circumvention audit passed successfully."

      - name: Build Application Bundles
        run: npm run build

      - name: Verify Build Output Integrity
        run: |
          if [ ! -f "dist/index.html" ] || [ ! -f "dist-electron/main/main.cjs" ]; then
            echo "::error::Build outputs are missing or empty."
            exit 1
          fi
          echo "Frontend and Electron bundles compiled successfully."
